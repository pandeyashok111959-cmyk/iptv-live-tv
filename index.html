<style>
*{

}

html{
  scroll-behavior:smooth;

body{
  margin:0;
  background:#070707;
  color:#fff;

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(10,10,10,.96);
  backdrop-filter:blur(12px);
  padding:15px;
  border-bottom:1px solid #242424;

.logo{

  margin-bottom:13px;
}

.logo span{
  color:#e50914;
}

.search{
  width:100%;
  padding:13px 16px;
  border:1px solid #333;
  border-radius:12px;
  background:#181818;
  color:white;
  font-size:16px;
  outline:none;
}

.search:focus{
  border-color:#e50914;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 0 2px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filters button{
  flex:none;
  border:0;
  padding:9px 15px;
  border-radius:22px;
  background:#242424;
  color:#fff;
  cursor:pointer;
  font-size:13px;
}

.filters button.active{

}

/* WHATSAPP */

.whatsapp{

  justify-content:center;
  padding:12px 10px 3px;
}

.whatsapp a{
  text-decoration:none;
  color:#fff;
  background:#168c45;
  padding:11px 20px;
  border-radius:25px;
  font-weight:bold;
  font-size:14px;
}

/* PLAYER */

.playerBox{

  background:#000;
  padding:10px;
  border-bottom:1px solid #222;
}

video{
  display:block;
  width:100%;
  max-height:55vh;
  background:#000;
  border-radius:10px;
}

.playerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 2px;
}

.now{
  font-weight:bold;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.qualityBox{
  display:flex;
  align-items:center;
  gap:6px;
}

.qualityBox label{
  color:#aaa;
  font-size:12px;
}

#qualitySelect{
  background:#202020;
  color:white;
  border:1px solid #444;
  border-radius:7px;
  padding:6px 8px;
}

/* STATUS */

.status{
  text-align:center;
  color:#999;
  padding:17px 10px;
  font-size:13px;
}

/* CHANNEL GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  padding:10px;
}

.card{
  position:relative;
  background:linear-gradient(145deg,#191919,#111);
  border:1px solid #242424;
  border-radius:14px;
  padding:8px;
  cursor:pointer;
  overflow:hidden;
  transition:.18s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#444;
}

.card:active{
  transform:scale(.97);
}

.logoBox{
  height:90px;
  background:#fff;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.logoBox img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.channelName{
  font-weight:bold;
  font-size:14px;
  margin-top:8px;
  padding-right:30px;
  line-height:1.25;
}

.group{
  color:#888;
  font-size:12px;
  margin-top:5px;
}

/* FAVORITE */

.favoriteBtn{
  position:absolute;
  right:9px;
  bottom:9px;
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:#292929;
  color:#aaa;
  font-size:17px;
  cursor:pointer;
  z-index:3;
}

.favoriteBtn.active{
  color:#ffd000;
  background:#3a3000;
}

/* LOAD MORE */

.loadMore{
  display:block;
  margin:15px auto 30px;
  padding:12px 25px;
  border:0;
  border-radius:10px;
  background:#e50914;
  color:white;
  font-size:15px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#999;
  padding:35px 15px;
  grid-column:1/-1;
}

footer{
  text-align:center;
  color:#666;
  font-size:12px;
  padding:25px 10px 35px;
}

@media(min-width:700px){

  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
    padding:15px;
  }

  header{
    padding-left:8%;
    padding-right:8%;
  }
}
</style>

"https://whatsapp.com/channel/0029Vb8wniPL2ATxBNDoh33A";

   VARIABLES

   ELEMENTS

document.getElementById("video");

document.getElementById("playerBox");

document.getElementById("nowPlaying");

const qualitySelect =
document.getElementById("qualitySelect");

document.getElementById("channels");

document.getElementById("status");

document.getElementById("search");

document.getElementById("loadMore");


/* =====================================
   FAVORITES
===================================== */

let favorites =
JSON.parse(
  localStorage.getItem(
    "abhi_live_tv_favorites"
  ) || "[]"
);


function saveFavorites(){

  localStorage.setItem(
    "abhi_live_tv_favorites",
    JSON.stringify(favorites)
  );

}


function channelKey(channel){

  return (
    channel.name +
    "|" +
    channel.url
  );

}


function isFavorite(channel){

  return favorites.includes(
    channelKey(channel)
  );

}


function toggleFavorite(channel){

  const key =
    channelKey(channel);

  if(favorites.includes(key)){

    favorites =
      favorites.filter(
        item => item !== key
      );

  }else{

    favorites.push(key);

  }

  saveFavorites();

  renderChannels();

}


/* =====================================
   LOAD PLAYLIST
===================================== */

async function loadPlaylist(){

  try{

    const response =
      await fetch(
        PLAYLIST_URL,
        {
          cache:"no-cache"
        }
      );

    if(!response.ok){

      throw new Error(
        "Playlist error"
      );

    }

    const text =
      await response.text();

    allChannels =
      parseM3U(text);

    status.textContent =
      allChannels.length +
      " India channels available";

    applyFilters();

  }catch(error){

    console.error(error);

    status.textContent =
      "❌ Playlist load नहीं हो पाई। Internet check करें।";

  }

}


/* =====================================
   M3U PARSER
===================================== */

function parseM3U(text){

  const lines =
    text.split(/\r?\n/);

  const result = [];

  let current = null;

  for(let i=0;i<lines.length;i++){

    const line =
      lines[i].trim();

    if(!line) continue;


    if(line.startsWith("#EXTINF")){

      const comma =
        line.indexOf(",");

      let name =
        comma >= 0
        ? line.substring(comma + 1).trim()
        : "Unknown Channel";


      name =
        name
        .replace(/#EXT.*$/,"")
        .trim();


      const logoMatch =
        line.match(
          /tvg-logo="([^"]*)"/i
        );


      const groupMatch =
        line.match(
          /group-title="([^"]*)"/i
        );


      current = {

        name:
          name || "Unknown Channel",

        logo:
          logoMatch
          ? logoMatch[1]
          : "",

        group:
          groupMatch
          ? groupMatch[1]
          : "Other",

        url:""

      };

      continue;
    }


    if(line.startsWith("#")){
      continue;
    }


    if(
      current &&
      (
        line.startsWith("http://") ||
        line.startsWith("https://")
      )
    ){

      current.url =
        line;

      result.push(
        current
      );

      current = null;

    }

  }

  return result;

}


/* =====================================
   SONY CHECK
===================================== */

function isSonyChannel(channel){

  const name =
    channel.name.toLowerCase();

  const group =
    channel.group.toLowerCase();


  return (
    name.includes("sony") ||
    group.includes("sony")
  );

}


/* =====================================
   FILTER
===================================== */

function applyFilters(){

  const query =
    search.value
    .toLowerCase()
    .trim();


  filteredChannels =
    allChannels.filter(
      channel => {

        const matchesSearch =
          !query ||
          channel.name
          .toLowerCase()
          .includes(query);


        let matchesGroup =
          true;


        if(
          currentGroup ===
          "FAVORITES"
        ){

          matchesGroup =
            isFavorite(channel);

        }

        else if(
          currentGroup ===
          "Sony"
        ){

          matchesGroup =
            isSonyChannel(
              channel
            );

        }

        else if(
          currentGroup !==
          "ALL"
        ){

          matchesGroup =
            channel.group
            .toLowerCase()
            .includes(
              currentGroup
              .toLowerCase()
            );

        }


        return (
          matchesSearch &&
          matchesGroup
        );

      }
    );


  visibleCount =
    INITIAL_CHANNELS;

  renderChannels();

}

      </div>`;

    loadMore.style.display =
      "none";

    return;

  }


  const fragment =
    document.createDocumentFragment();


  list.forEach(
