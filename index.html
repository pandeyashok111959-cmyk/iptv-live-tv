<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>India Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#111;
  padding:15px;
  border-bottom:1px solid #292929;
}

.logo{
  text-align:center;
  font-size:25px;
  font-weight:bold;
  margin-bottom:12px;
}

.search{
  width:100%;
  padding:13px 15px;
  border:0;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 0 2px;
}

.filters button{
  flex:none;
  border:0;
  padding:8px 14px;
  border-radius:20px;
  background:#252525;
  color:white;
  cursor:pointer;
}

.filters button.active{
  background:#e50914;
}

.playerBox{
  display:none;
  background:#000;
  padding:10px;
}

video{
  display:block;
  width:100%;
  max-height:55vh;
  background:#000;
  border-radius:6px;
}

.now{
  padding:10px 2px 3px;
  font-weight:bold;
}

.status{
  text-align:center;
  color:#aaa;
  padding:18px 10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  padding:10px;
}

.card{
  background:#171717;
  border-radius:12px;
  padding:8px;
  cursor:pointer;
  overflow:hidden;
  transition:.15s;
}

.card:active{
  transform:scale(.97);
}

.logoBox{
  height:90px;
  background:#fff;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.logoBox img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.channelName{
  font-weight:bold;
  font-size:14px;
  margin-top:8px;
  line-height:1.25;
}

.group{
  color:#999;
  font-size:12px;
  margin-top:5px;
}

.loadMore{
  display:block;
  margin:15px auto 30px;
  padding:12px 25px;
  border:0;
  border-radius:10px;
  background:#e50914;
  color:white;
  font-size:15px;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:30px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    📺 India Live TV
  </div>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="🔍 Channel search..."
  >

  <div class="filters">
    <button class="active" data-group="ALL">All</button>
    <button data-group="News">News</button>
    <button data-group="Entertainment">Entertainment</button>
    <button data-group="Music">Music</button>
    <button data-group="Sports">Sports</button>
    <button data-group="Movies">Movies</button>
    <button data-group="Kids">Kids</button>
  </div>

</header>


<div id="playerBox" class="playerBox">

  <video
    id="video"
    controls
    playsinline
    preload="none"
  ></video>

  <div id="nowPlaying" class="now">
    कोई channel select करें
  </div>

</div>


<div id="status" class="status">
  Channels load हो रहे हैं...
</div>


<div id="channels" class="grid"></div>


<button
  id="loadMore"
  class="loadMore"
  style="display:none"
>
  और Channels दिखाएँ
</button>


<script>

const PLAYLIST_URL =
"https://iptv-org.github.io/iptv/countries/in.m3u";


const INITIAL_CHANNELS = 40;
const LOAD_STEP = 40;


let allChannels = [];
let filteredChannels = [];

let currentGroup = "ALL";
let visibleCount = INITIAL_CHANNELS;

let hls = null;


const video =
document.getElementById("video");

const playerBox =
document.getElementById("playerBox");

const nowPlaying =
document.getElementById("nowPlaying");

const channelsBox =
document.getElementById("channels");

const status =
document.getElementById("status");

const search =
document.getElementById("search");

const loadMore =
document.getElementById("loadMore");


/* -----------------------------
   LOAD PLAYLIST
----------------------------- */

async function loadPlaylist(){

  try{

    const response =
      await fetch(PLAYLIST_URL, {
        cache:"no-cache"
      });

    if(!response.ok){
      throw new Error("Playlist error");
    }

    const text =
      await response.text();

    allChannels =
      parseM3U(text);

    status.textContent =
      allChannels.length +
      " India channels available";

    applyFilters();

  }catch(error){

    console.error(error);

    status.textContent =
      "❌ Playlist load नहीं हो पाई। Internet check करें।";

  }

}


/* -----------------------------
   M3U PARSER
----------------------------- */

function parseM3U(text){

  const lines =
    text.split(/\r?\n/);

  const result = [];

  let current = null;

  for(let i=0;i<lines.length;i++){

    const line =
      lines[i].trim();

    if(!line) continue;


    if(line.startsWith("#EXTINF")){

      const comma =
        line.indexOf(",");

      let name =
        comma >= 0
        ? line.substring(comma + 1).trim()
        : "Unknown Channel";


      /* Remove accidental metadata */

      name =
        name
        .replace(/#EXT.*$/,"")
        .trim();


      const logoMatch =
        line.match(/tvg-logo="([^"]*)"/i);

      const groupMatch =
        line.match(/group-title="([^"]*)"/i);


      current = {

        name:
          name || "Unknown Channel",

        logo:
          logoMatch
          ? logoMatch[1]
          : "",

        group:
          groupMatch
          ? groupMatch[1]
          : "Other",

        url:""

      };

      continue;
    }


    /*
      Ignore VLC options and other
      #EXT lines.
    */

    if(line.startsWith("#")){
      continue;
    }


    /*
      Find the actual stream URL.
    */

    if(
      current &&
      (
        line.startsWith("http://") ||
        line.startsWith("https://")
      )
    ){

      current.url = line;

      result.push(current);

      current = null;
    }

  }

  return result;
}


/* -----------------------------
   FILTER
----------------------------- */

function applyFilters(){

  const query =
    search.value
    .toLowerCase()
    .trim();


  filteredChannels =
    allChannels.filter(channel => {

      const matchesSearch =
        !query ||
        channel.name
        .toLowerCase()
        .includes(query);


      const matchesGroup =
        currentGroup === "ALL" ||
        channel.group
        .toLowerCase()
        .includes(currentGroup.toLowerCase());


      return matchesSearch && matchesGroup;

    });


  visibleCount =
    INITIAL_CHANNELS;

  renderChannels();

}


/* -----------------------------
   RENDER
----------------------------- */

function renderChannels(){

  channelsBox.innerHTML = "";


  const list =
    filteredChannels
    .slice(0, visibleCount);


  if(list.length === 0){

    channelsBox.innerHTML =
      `<div class="empty">
        😕 कोई channel नहीं मिला
      </div>`;

    loadMore.style.display =
      "none";

    return;
  }


  const fragment =
    document.createDocumentFragment();


  list.forEach(channel => {

    const card =
      document.createElement("div");

    card.className =
      "card";


    const logoBox =
      document.createElement("div");

    logoBox.className =
      "logoBox";


    if(channel.logo){

      const img =
        document.createElement("img");

      img.src =
        channel.logo;

      img.loading =
        "lazy";

      img.onerror =
        function(){

          this.style.display =
            "none";

        };

      logoBox.appendChild(img);

    }else{

      logoBox.textContent =
        "📺";

      logoBox.style.fontSize =
        "35px";

    }


    const name =
      document.createElement("div");

    name.className =
      "channelName";

    name.textContent =
      channel.name;


    const group =
      document.createElement("div");

    group.className =
      "group";

    group.textContent =
      channel.group;


    card.appendChild(logoBox);

    card.appendChild(name);

    card.appendChild(group);


    card.onclick =
      () => playChannel(channel);


    fragment.appendChild(card);

  });


  channelsBox.appendChild(fragment);


  if(visibleCount < filteredChannels.length){

    loadMore.style.display =
      "block";

  }else{

    loadMore.style.display =
      "none";

  }

}


/* -----------------------------
   LOAD MORE
----------------------------- */

loadMore.onclick =
function(){

  visibleCount +=
    LOAD_STEP;

  renderChannels();

};


/* -----------------------------
   SEARCH
----------------------------- */

search.addEventListener(
  "input",
  function(){

    applyFilters();

  }
);


/* -----------------------------
   CATEGORY BUTTONS
----------------------------- */

document
.querySelectorAll(".filters button")
.forEach(button => {

  button.addEventListener(
    "click",
    function(){

      document
      .querySelectorAll(".filters button")
      .forEach(b =>
        b.classList.remove("active")
      );


      this.classList.add("active");


      currentGroup =
        this.dataset.group;


      applyFilters();

    }
  );

});


/* -----------------------------
   HLS PLAYER
----------------------------- */

function playChannel(channel){

  playerBox.style.display =
    "block";


  nowPlaying.textContent =
    "▶️ " + channel.name;


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  /* Destroy previous HLS instance */

  if(hls){

    hls.destroy();

    hls = null;

  }


  video.pause();

  video.removeAttribute("src");

  video.load();


  const url =
    channel.url;


  /*
    Native HLS support
  */

  if(
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ){

    video.src = url;

    video.play()
    .catch(() => {});

    return;
  }


  /*
    HLS.js support
  */

  if(
    window.Hls &&
    Hls.isSupported()
  ){

    hls =
      new Hls({

        enableWorker:true,

        lowLatencyMode:false,

        backBufferLength:30,

        maxBufferLength:20,

        capLevelToPlayerSize:true

      });


    hls.loadSource(url);

    hls.attachMedia(video);


    hls.on(
      Hls.Events.MANIFEST_PARSED,
      function(){

        video.play()
        .catch(() => {});

      }
    );


    hls.on(
      Hls.Events.ERROR,
      function(event,data){

        console.log(
          "HLS error:",
          data
        );


        if(
          data.fatal
        ){

          nowPlaying.textContent =
            "❌ यह stream अभी नहीं चल रही: "
            + channel.name;

        }

      }
    );


    return;
  }


  nowPlaying.textContent =
    "❌ इस browser में HLS support नहीं है";

}


/* -----------------------------
   START
----------------------------- */

loadPlaylist();

</script>

</body>
      </html>
