<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live TV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #151515;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    #search {
      width: 100%;
      max-width: 500px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    #playerBox {
      display: none;
      padding: 12px;
      background: #000;
    }

    video {
      width: 100%;
      max-height: 60vh;
      background: black;
    }

    #nowPlaying {
      padding: 8px 0;
      font-weight: bold;
    }

    #channels {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .channel {
      background: #181818;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .channel:hover {
      transform: scale(1.02);
      background: #242424;
    }

    .channel img {
      width: 100%;
      height: 80px;
      object-fit: contain;
      background: white;
      border-radius: 6px;
    }

    .channelName {
      margin-top: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .category {
      margin-top: 5px;
      color: #aaa;
      font-size: 12px;
    }

    #status {
      text-align: center;
      padding: 20px;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>
  <h1>📺 Live TV</h1>
  <input
    id="search"
    type="text"
    placeholder="🔍 Channel search..."
  >
</header>

<div id="playerBox">
  <video id="video" controls playsinline></video>
  <div id="nowPlaying"></div>
</div>

<div id="status">Channels load हो रहे हैं...</div>
<div id="channels"></div>

<script>
  const PLAYLIST_URL =
    "https://iptv-org.github.io/iptv/index.m3u";

  const channelsContainer =
    document.getElementById("channels");

  const status =
    document.getElementById("status");

  const search =
    document.getElementById("search");

  const playerBox =
    document.getElementById("playerBox");

  const video =
    document.getElementById("video");

  const nowPlaying =
    document.getElementById("nowPlaying");

  let channels = [];

  async function loadPlaylist() {
    try {
      const response = await fetch(PLAYLIST_URL);

      if (!response.ok) {
        throw new Error("Playlist load failed");
      }

      const text = await response.text();

      parseM3U(text);

      status.textContent =
        channels.length + " channels loaded";

      displayChannels(channels);

    } catch (error) {
      console.error(error);

      status.textContent =
        "Playlist load नहीं हो पाई।";
    }
  }

  function parseM3U(text) {
    const lines = text.split(/\r?\n/);

    channels = [];

    for (let i = 0; i < lines.length; i++) {

      if (lines[i].startsWith("#EXTINF")) {

        const info = lines[i];

        const nameMatch =
          info.match(/,(.*)$/);

        const logoMatch =
          info.match(/tvg-logo="([^"]*)"/);

        const groupMatch =
          info.match(/group-title="([^"]*)"/);

        const name =
          nameMatch
            ? nameMatch[1].trim()
            : "Unknown Channel";

        const logo =
          logoMatch
            ? logoMatch[1]
            : "";

        const group =
          groupMatch
            ? groupMatch[1]
            : "Other";

        let url = "";

        for (
          let j = i + 1;
          j < lines.length;
          j++
        ) {
          if (
            lines[j].trim() &&
            !lines[j].startsWith("#")
          ) {
            url = lines[j].trim();
            break;
          }
        }

        if (url) {
          channels.push({
            name,
            logo,
            group,
            url
          });
        }
      }
    }
  }

  function displayChannels(list) {

    channelsContainer.innerHTML = "";

    list.forEach(channel => {

      const card =
        document.createElement("div");

      card.className = "channel";

      card.innerHTML = `
        ${
          channel.logo
          ? `<img src="${channel.logo}"
                 onerror="this.style.display='none'">`
          : ""
        }

        <div class="channelName">
          ${escapeHTML(channel.name)}
        </div>

        <div class="category">
          ${escapeHTML(channel.group)}
        </div>
      `;

      card.onclick = () =>
        playChannel(channel);

      channelsContainer.appendChild(card);
    });
  }

  function playChannel(channel) {

    playerBox.style.display = "block";

    nowPlaying.textContent =
      "▶️ " + channel.name;

    video.src = channel.url;

    video.play().catch(() => {});

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  search.addEventListener(
    "input",
    function () {

      const query =
        search.value.toLowerCase().trim();

      const filtered =
        channels.filter(channel =>
          channel.name
            .toLowerCase()
            .includes(query)
        );

      displayChannels(filtered);
    }
  );

  function escapeHTML(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  loadPlaylist();
</script>

</body>
  </html>
